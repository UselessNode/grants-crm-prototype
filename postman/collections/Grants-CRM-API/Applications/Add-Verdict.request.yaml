$kind: http-request
method: POST
url: '{{baseUrl}}/api/applications/{{applicationId}}/verdict'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "verdict": "approved",
      "comment": "Комментарий эксперта"
    }
