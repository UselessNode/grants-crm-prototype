$kind: http-request
method: POST
url: '{{baseUrl}}/api/expert/applications/{{applicationId}}/finalize'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "verdict": "approved",
      "comment": "Финальный комментарий"
    }
