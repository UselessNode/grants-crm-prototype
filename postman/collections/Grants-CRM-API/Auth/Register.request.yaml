$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "123456",
      "surname": "Иванов",
      "name": "Иван",
      "patronymic": "Иванович"
    }
